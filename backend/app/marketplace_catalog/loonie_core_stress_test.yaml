id: loonie.core_stress_test
name: Loonie Core Stress Test
publisher: Loonie (in-house)
version: "0.1.0"
tier: free
price_usd: null
category: stress_test
summary: >
  Free, always-available stress test covering a rate shock, a temporary job loss, and a market
  correction — reads your existing computed wealth analytics only, never raw transactions.
inputs:
  - net_worth
  - liquidity
  - cashflow
  - diversification
tags:
  - stress-test
  - free
  - in-house
scenarios:
  - id: rate_shock_up_2pt
    description: >
      Variable interest rates (mortgage, lines of credit) rise by 2 percentage points and stay
      there for at least a year.
  - id: job_loss_3mo
    description: >
      The client's primary income drops to $0 for 3 months, then fully recovers.
  - id: market_correction_20pct
    description: >
      Investment/retirement account balances fall 20% and take 18 months to recover.
kind: stress_test
triggers:
  - stress test
  - job loss
  - lose my job
  - rates rise
  - interest rates
  - market crash
  - market correction
  - how resilient
  - worst case
examples:
  - Run a stress test
  - What if I lose my job for 3 months?
  - What happens if interest rates rise 2 points?
