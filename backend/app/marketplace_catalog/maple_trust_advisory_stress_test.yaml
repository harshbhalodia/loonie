id: maple_trust.advisory_stress_test
name: Maple Trust Advisory Stress Test
publisher: "Maple Trust Financial (fictional demo publisher)"
version: "0.1.0"
tier: paid
price_usd: 4.99
category: stress_test
summary: >
  Fictional bank example blueprint demonstrating a premium, five-scenario advisory-desk stress
  test (rate shock, job loss, market correction, inflation spike, income growth stall) with
  bank-style framing. NOT a real financial institution or product — a demo of the marketplace's
  paid, publisher-branded blueprint tier.
inputs:
  - net_worth
  - liquidity
  - cashflow
  - diversification
  - goal_feasibility
  - income_forecast
tags:
  - stress-test
  - paid
  - bank-partner-demo
specialist_system_prompt: >
  You are a stress-test specialist on Maple Trust Financial's advisory desk. You only ever
  reason from the verified figures you are given — never invent or estimate numbers. Given one
  shock scenario and the client's real financial figures (net worth, liquidity, cashflow,
  diversification, goal feasibility, income forecast), write a short (3-4 sentence) internal
  note: how would this scenario affect them, and how resilient are they?
lead_system_prompt: >
  You are the lead advisor on Maple Trust Financial's advisory desk, presenting a stress-test
  review directly to your client. You have specialist notes for several shock scenarios plus
  the client's headline figures — all already verified, computed facts. Never invent numbers
  beyond what you were given. Write a clear, client-facing summary with this structure:
  1) overall resilience readout (1-2 sentences), 2) scenario-by-scenario summary (most
  concerning first), 3) impact on any active financial goals, 4) 3-5 concrete next steps to
  improve resilience. Keep it under 350 words and end with exactly this line: {disclaimer}
disclaimer: >
  This automated stress test was generated by a local LLM using Maple Trust Financial's
  published assumptions, applied to your own computed figures. It is not personalized
  financial advice from a licensed advisor and should not be the sole basis for any financial
  decision.
scenarios:
  - id: rate_shock_up_2pt
    description: Variable interest rates rise 2 points and stay there for a year.
  - id: job_loss_3mo
    description: Primary income drops to $0 for 3 months, then fully recovers.
  - id: market_correction_20pct
    description: Investment/retirement balances fall 20%, recover over 18 months.
  - id: inflation_spike_6pct
    description: Annual inflation runs at 6% for 2 years, eroding fixed budgets.
  - id: income_growth_stall_2yr
    description: Income growth stalls at 0% for 2 years while expenses keep rising.
kind: stress_test
triggers:
  - advisory stress test
  - inflation spike
  - income stall
  - bank style review
examples:
  - Give me a full advisory-desk stress review
