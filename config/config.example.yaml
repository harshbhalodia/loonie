# Loonie configuration — copy to config.yaml and edit.
# config.yaml is never overwritten by upgrades and is git-ignored.

app:
  name: Loonie
  host: 0.0.0.0
  port: 8000
  # Origins allowed to call the API (the Vite dev server, the packaged Tauri desktop app, and
  # any deployed frontend). Tauri v2 serves the bundled app from http://tauri.localhost on
  # Windows (tauri://localhost on macOS/Linux).
  cors_origins:
    - http://localhost:5173
    - http://tauri.localhost
    - tauri://localhost

database:
  # Path is relative to the backend/ working directory.
  path: ./data/lifeos.db

auth:
  jwt_secret: change-me-to-a-long-random-string
  access_token_expire_minutes: 43200 # 30 days
  # Lets anyone using this install create their own account (each gets a separate data folder).
  allow_registration: true

# AI is entirely optional — every core feature works without it.
ai:
  enabled: true
  provider: local
  endpoint: http://localhost:1234/api/v1/chat
  model: qwen/qwen3.6-35b-a3b
  # "simple" posts {model, system_prompt, input} and reads a single text field back.
  # "openai" posts {model, messages:[...]} to an OpenAI-compatible /chat/completions endpoint.
  style: simple
  # Dot-path into the JSON response used to find the generated text (tried first).
  response_field: output
  temperature: 0.2
  # Hard cap on generated tokens per request — protects against a confused/looping reasoning
  # model generating forever (no external timeout can stop that once the model server itself is
  # still emitting tokens). Reasoning models like Qwen3.6 can burn thousands of tokens on
  # chain-of-thought before answering, so keep this generous or heavy prompts get cut off mid-think.
  max_tokens: 65536

# Jev (TypeSafe AI's System One model) powers the Decision Maker page. Optional — the rest of
# Loonie works without it. Get an API key from https://console.typesafe.ai/keys.
jev:
  enabled: false
  api_key: ""
  base_url: https://api.typesafe.ai/v1/systemone
  model: jev-latest

# Loonie Cloud — optional sync of an account's data across devices. Each user links their own
# account from Settings -> Loonie Cloud; nothing syncs until they do. Point base_url at the
# cloud service (see cloud/README.md). It must be https:// unless it is localhost.
cloud:
  base_url: ""

# Google Drive backup — optional. Backs up the local database + statement PDFs
# to a "Loonie Backups" folder in your own Google Drive, so a hardware failure doesn't mean
# losing your data. Uses the narrow `drive.file` scope — Google only lets this app see files it
# created itself, never the rest of your Drive.
#
# Users just click "Sign in with Google" in Settings. The app ships with the maintainer's own OAuth
# client (backend/app/google_oauth_client.json, or the LOONIE_GOOGLE_CLIENT_ID /
# LOONIE_GOOGLE_CLIENT_SECRET environment variables at build time). The client_id / client_secret
# below are only an advanced override for people who want to use their own Google Cloud client.
google_drive:
  enabled: false
  client_id: ""
  client_secret: ""

# Blueprint Marketplace: browse/install/run declarative stress-test blueprints (free or paid,
# in-house or third-party e.g. a bank's advisory team). Blueprints are bundled YAML data under
# backend/app/marketplace_catalog/, never executable code — see
# https://github.com/harshbhalodia/localagents/blob/main/docs/architecture/blueprint-marketplace.md
# for the full design. There is no hosted marketplace/payment backend yet, so paid-blueprint
# licensing below is a local, offline DEMO stand-in — never treat demo_license_secret as real
# payment security.
marketplace:
  # When true, POST /marketplace/dev/demo-license issues a signed license for any paid
  # blueprint without a real purchase — turn this off once a real entitlement service exists.
  demo_mode: true
  demo_license_secret: change-me-marketplace-secret
